# cargo-deny: licences, advisories, bans and sources (chapter 03, "Licences").
# Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste (MIT OR Apache-2.0) is a compile-time macro crate whose author
    # archived it; it is unmaintained, not vulnerable. It comes in through
    # gemm, candle's matrix multiplication (sprig-embed), and no gemm release
    # drops it yet.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained build-time macro used by gemm (candle)" },
    # chrono, chrono-tz and humantime were marked unmaintained in November 2026 (no known
    # vulnerability). Replacing them (jiff or time) touches many crates' Cargo.toml and waits
    # for Kiran's decision (bugfix-interim, lead's note of 17 Nov).
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, not vulnerable; replacement pending Kiran's decision" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz: unmaintained, not vulnerable; replacement pending Kiran's decision" },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained, not vulnerable; replacement pending Kiran's decision" },
    # protobuf 2.28.0 (MIT) comes in through raft-engine 0.4.2 (approved by Kiran,
    # 18 Nov 2026), whose newest release still uses it for log entries and
    # metrics, and through raft 0.7.0's protobuf codec. It parses two things:
    # the engine's own log entries, and Raft messages from other nodes
    # (crates/sprig-raft/src/wire.rs), so the input is NOT only our own.
    # The advisory is unbounded recursion on unknown fields. It was reported
    # against 3.x and is listed for every release below 3.7.2; in 2.28.0 an
    # unknown group is skipped by a loop that refuses a group inside it
    # (rt::skip_group), and known nested messages stop at depth 100. The test
    # wire::tests::hostile_messages_are_refused_not_crashed_on holds that
    # (2,000,000 nested groups are refused, not recursed into), and must keep
    # passing if protobuf moves. Peers are also authenticated: Raft needs
    # mutual TLS unless SPRIGDB_ENGINE_INSECURE_CLUSTER is set. Remove this
    # entry when raft-engine and raft no longer need protobuf 2.
    { id = "RUSTSEC-2024-0437", reason = "protobuf 2.28.0 also parses peers' Raft messages; its unknown-group skip is a loop, not the recursion the advisory describes (test in sprig-raft wire.rs), and peers are behind mutual TLS" },
    # pin-utils (MIT OR Apache-2.0) was archived in October 2026: unmaintained, not
    # vulnerable. It comes in through nix 0.26, which raft-engine 0.4.2 (approved by
    # Kiran, 18 Nov 2026) uses for file locking; no raft-engine release drops it yet.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: unmaintained, not vulnerable; via nix 0.26 under raft-engine" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The allow-list is policy; not every licence on it is in use yet.
unused-allowed-license = "allow"
# Apache-2.0-compatible licences only. GPL-only crates are refused.
# MPL-2.0 is file-level copyleft: allowed for crates used unmodified.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

# webpki-roots is Mozilla's root-certificate bundle, published as data under the
# permissive CDLA-Permissive-2.0 licence. Allowed for this crate only.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# dragonbox_ecma (float printing, via the oxc JavaScript compiler that the
# logic layer uses, R7) is "Apache-2.0 WITH LLVM-exception OR BSL-1.0". Both
# are permissive and Apache-2.0-compatible. Allowed for this crate only.
[[licenses.exceptions]]
crate = "dragonbox_ecma"
allow = ["Apache-2.0 WITH LLVM-exception", "BSL-1.0"]

# tiny-keccak (SHA-3) is CC0-1.0, a public-domain dedication. Allowed for this
# crate only.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[licenses.private]
# Workspace crates are Apache-2.0 and never published from here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# OpenSSL is not used: TLS goes through rustls (chapter 03).
deny = [
    { crate = "openssl", reason = "TLS uses rustls only (chapter 03)" },
    { crate = "openssl-sys", reason = "TLS uses rustls only (chapter 03)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
