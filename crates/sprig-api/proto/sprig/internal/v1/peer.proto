// sprig.internal.v1.GatewayPeer: gateways calling each other on 7403
// (`listener.peer.bind`), with mutual TLS from the internal CA. Never
// exposed to clients.
syntax = "proto3";

package sprig.internal.v1;

service GatewayPeer {
  // KILL [QUERY] for a session whose id names this gateway's slot. The
  // caller has already checked that its user may kill the session's user;
  // this gateway checks the tenant.
  rpc Kill(KillRequest) returns (KillReply);
  // The sessions of this gateway, for SHOW PROCESSLIST across gateways.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsReply);
  // Starts this gateway's drain (sprigctl gateway drain).
  rpc Drain(DrainRequest) returns (DrainReply);
  // A transaction-handle call that landed on another gateway, forwarded with the caller's credentials.
  rpc Forward(ForwardRequest) returns (ForwardReply);
  // A login of a tenant whose residency doesn't allow the calling
  // gateway's DC: this gateway, in an allowed DC, decides it (credentials
  // stay in allowed DCs) and returns the principal only.
  rpc HandoffLogin(HandoffLoginRequest) returns (HandoffLoginReply);
  // A change stream of a tenant homed in this gateway's DC, opened at a
  // gateway of another DC: authenticated again and served here; the
  // calling gateway relays the events to its client. The first message
  // says whether the stream opened.
  rpc WatchChanges(WatchChangesRequest) returns (stream WatchChangesEvent);
  // A FOR EACH TENANT definition's change reaching the members this
  // gateway's DC indexes: the declarer's gateway asks a gateway of every
  // other DC.
  rpc InheritedMembers(InheritedMembersRequest) returns (InheritedMembersReply);
  // A tenant homed in this gateway's DC: its change feed's items, read by
  // this DC's shared reader, for a gateway of another DC that renders them
  // for its own client (a MongoDB change stream opened there). The first
  // message says whether the tail opened.
  rpc TailFeed(TailFeedRequest) returns (stream TailFeedMessage);
}

message KillRequest {
  uint32 connection_id = 1;
  bool query_only = 2;
  // The tenant of the caller; 0 for an operator.
  uint64 tenant_id = 3;
  // The caller's user: without wider privileges, a session may kill only
  // sessions of its own user.
  string user = 4;
}

message KillReply {
  // The session exists on this gateway.
  bool found = 1;
  // It belongs to the caller's tenant and user, and was killed.
  bool killed = 2;
}

message ListSessionsRequest {
  // Only this tenant's sessions; 0 for all.
  uint64 tenant_id = 1;
}

message SessionRow {
  uint32 id = 1;
  string user = 2;
  string host = 3;
  string db = 4;
  string command = 5;
  uint64 time_s = 6;
  string state = 7;
  string info = 8;
  uint64 tenant_id = 9;
  string protocol = 10;
}

message ListSessionsReply {
  string gateway_id = 1;
  repeated SessionRow sessions = 2;
}

message DrainRequest {
  // Who asked, for the log.
  string reason = 1;
}

message DrainReply {
  // The drain started now (false: it was already draining).
  bool started = 1;
}

message ForwardRequest {
  // The caller's Authorization header, verified again by the owner.
  string authorization = 1;
  // "Sql.Execute", "Transactions.Commit" or "Transactions.Rollback".
  string method = 2;
  // The request as proto3 JSON.
  string request_json = 3;
  // The client address the first gateway saw.
  string client_addr = 4;
}

message ForwardReply {
  // The HTTP status the owner answered with.
  uint32 http_status = 1;
  // The REST reply body (a result or an error).
  string body_json = 2;
}

message HandoffLoginRequest {
  // sprig-auth's HandoffStart as JSON: the login's request fields and the
  // source DC.
  string start_json = 1;
  // The password the client sent in clear text over TLS to the source.
  bytes password = 2;
}

message HandoffLoginReply {
  // The login was accepted.
  bool accepted = 1;
  // When accepted: sprig-auth's PrincipalWire as JSON.
  string principal_json = 2;
  // When refused: the MySQL error packet's number, SQLSTATE and message.
  uint32 error_code = 3;
  string sql_state = 4;
  string error_message = 5;
}

message WatchChangesRequest {
  // The client's Authorization header, verified again here.
  string authorization = 1;
  // The tenant for credentials that don't name it (x-sprig-tenant).
  string tenant = 2;
  // The client address the first gateway saw.
  string client_addr = 3;
  // The client's TLS, as the first gateway saw it: whether it used TLS,
  // the server name it asked for, and a verified client certificate's
  // subject and issuer (empty without one).
  bool tls = 4;
  string sni = 5;
  string client_subject = 6;
  string client_issuer = 7;
  // What to watch (sprig.v1.WatchRequest's fields).
  string database = 8;
  repeated string objects = 9;
  string start_after = 10;
  uint64 start_at_hlc = 11;
  bool full_document = 12;
  // The space the subscriber reads in (Sprig-Space).
  string space = 13;
}

message WatchChangesEvent {
  // The first message: the stream opened.
  bool opened = 1;
  // An event or heartbeat (sprig.v1.ChangeEvent's fields).
  string resume_token = 2;
  uint64 commit_hlc = 3;
  string object = 4;
  string op = 5;
  string key = 6;
  string after = 7;
  string update = 8;
  string ddl = 9;
  // The stream didn't open, or ended, with this error: the REST error
  // body as JSON (sprig.v1's ErrorBody). The last message.
  string error_json = 10;
}

message InheritedMembersRequest {
  // "drop_sink": drop the members' instances of sink definition
  // `object_id` of declarer `tenant_id`, with the connections only they
  // use; "rollout": the members holding an instance of stream or queue
  // definition `object_id` apply its sinks and derived state again;
  // "drop_trigger": the members' instances of trigger definition
  // `object_id` stop and go; "override": an override FOR TENANT
  // `target_tenant_id` (FOR SUBTREE with `subtree`) of definition
  // `object_id` reaches the members it applies to; "count": only count the
  // instances of definition `object_id`; "broadcast": deliver broadcast
  // `payload` of definition `object_id` to member `target_tenant_id`.
  string op = 1;
  uint64 tenant_id = 2;
  uint64 object_id = 3;
  // The declarer's catalog version the change reached: the callee reads
  // the declarer's catalog at least at it (0: as its cache has it).
  uint64 catalog_version = 4;
  // The member an override or a broadcast is for.
  uint64 target_tenant_id = 5;
  // An override FOR SUBTREE.
  bool subtree = 6;
  // A broadcast: its record as JSON (id, publisher, key, value, headers,
  // WITH INSTANCE).
  bytes payload = 7;
}

message InheritedMembersReply {
  // The member instances this DC reached (for "count", has; for
  // "broadcast", 1 when delivered, 0 when skipped).
  uint64 instances = 1;
}

message TailFeedRequest {
  uint64 tenant_id = 1;
  // Resume after this token (hex); empty: from now.
  string start_after = 2;
  // The calling gateway's DC: a tenant's tail goes only to its allowed DCs.
  string caller_dc = 3;
  // Start at this HLC time (MongoDB's `startAtOperationTime`) through the
  // home cluster's feed time index; 0: `start_after`, or from now.
  uint64 start_at_hlc = 4;
}

message TailFeedMessage {
  // The first message: the tail opened; `item` holds its starting token
  // (hex, UTF-8).
  bool opened = 1;
  // A feed item, JSON (sprig-gateway's mongo::feed_relay format).
  bytes item = 2;
  // The tail didn't open, or ended, with this error: the REST error body
  // as JSON. The last message.
  string error_json = 3;
}
