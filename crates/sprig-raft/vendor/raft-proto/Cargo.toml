# raft-proto 0.7.0 (TiKV Project Authors, Apache-2.0), vendored by SprigDB.
#
# Changed from the crates.io release: the protobuf-2 code that build.rs used to
# generate with protoc is checked in (src/protos/eraftpb.rs, generated by
# rust-protobuf 2.28.0 from proto/eraftpb.proto), so building needs no protoc;
# the build script, its protobuf-build dependency and the prost-codec feature
# are removed. The workspace's [patch.crates-io] points raft at this copy.
[package]
name = "raft-proto"
version = "0.7.0"
authors = ["The TiKV Project Developers"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tikv/raft-rs"
description = "Protocol definitions for the rust language implementation of the Raft algorithm (vendored, generated code checked in)."
publish = false

[features]
default = ["protobuf-codec"]
protobuf-codec = ["bytes", "protobuf/bytes"]

[dependencies]
bytes = { version = "1", optional = true }
protobuf = "=2.28.0"
