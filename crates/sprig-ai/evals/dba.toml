  { tool = "propose_logic", args = { db = "shop", sql = '''CREATE VALIDATION qty_limit ON orders FOR INSERT, UPDATE LANGUAGE kirun AS '{"namespace": "Shop", "name": "QtyLimit", "parameters": {"qty": {"parameterName": "qty", "schema": {"type": ["INTEGER"]}}}, "events": {"output": {"name": "output", "parameters": {}}, "reject": {"name": "reject", "parameters": {"message": {"type": ["STRING"]}}}}, "steps": {"big": {"statementName": "big", "namespace": "System", "name": "If", "parameterMap": {"condition": {"c": {"type": "EXPRESSION", "expression": "Arguments.qty > 100"}}}}, "no": {"statementName": "no", "namespace": "System", "name": "GenerateEvent", "executeIftrue": {"Steps.big.true": true}, "parameterMap": {"eventName": {"e": {"type": "VALUE", "value": "reject"}}, "results": {"r": {"type": "VALUE", "value": {"name": "message", "value": {"isExpression": false, "value": "qty must be at most 100"}}}}}}}}' ''', why = "Refuses inserts and updates of orders with qty above 100." }, has = { sql = ["CREATE VALIDATION", "qty"] } },
