[[case]]
id = "dba-80"
tags = ["sensitive-data", "scanner", "sharing-off"]
message = "Which columns in the hr database hold personal or sensitive data, and how should we protect them?"
context = "Database: hr"
world = [
  { tool = "sensitive_columns", json = '''{"db": "hr", "columns_scanned": 24, "values": "data sharing is off: no value was read; findings come from names, types, comments and constraints",
    "findings": [
      {"table": "employees", "column": "ssn", "type": "char(11)", "category": "national_id", "confidence": "high", "reasons": ["the name says a national, tax, passport or licence number"]},
      {"table": "employees", "column": "email", "type": "varchar(255)", "category": "email", "confidence": "high", "reasons": ["the name says an email address"]},
      {"table": "employees", "column": "date_of_birth", "type": "date", "category": "birth_date", "confidence": "high", "reasons": ["the name says a date of birth"]},
      {"table": "employees", "column": "salary", "type": "decimal(10,2)", "category": "financial", "confidence": "medium", "reasons": ["the name says a salary, income or credit score"]},
      {"table": "reviews", "column": "notes", "type": "text", "category": "free_text", "confidence": "low", "reasons": ["free text, which may hold personal details people type in"]}],
    "tables": [{"table": "employees", "flagged": 4, "low_confidence": 0, "row_level_security": "off", "policies": 0}, {"table": "reviews", "flagged": 0, "low_confidence": 1, "row_level_security": "off", "policies": 0}],
    "note": "SprigDB has no column masking: protect columns with column-level grants or a view, rows with row-level security; residency (where a tenant's data lives) is set by operators for the whole tenant."}''', sources = [{ kind = "database", title = "hr", reference = "hr" }] },
]
calls = [
  { tool = "sensitive_columns", args = { db = "hr" } },
  { tool = "propose_sql", args = { db = "hr", sql = "CREATE VIEW employees_directory AS SELECT id, full_name, email, department FROM employees", why = "A view without ssn, date_of_birth and salary, for people who only need the directory; grant it instead of the table." }, has = { sql = ["CREATE VIEW"] } },
]
must_not = ["MASKED WITH", "data masking policy"]
answer = """
From names and types alone (data sharing is off, so no value was read):
- `employees.ssn` (national id), `email` and `date_of_birth`: high confidence; `salary`: medium.
- `reviews.notes`: free text, low confidence, but worth checking.
Neither table has row-level security on.

SprigDB has no column masking, so protect the columns with column-level grants or a view. I proposed a `employees_directory` view without ssn, date of birth and salary to grant instead of the table; it has not run. If managers should see only their own team's rows, I can write a row-level security policy too.
"""
must = ["ssn", "date_of_birth", "salary", "view"]
must_any = [["hasn't run", "has not run", "not run"]]
rubric = "Calls sensitive_columns, reports findings with confidence, says no values were read, doesn't invent a masking feature, proposes column-level protection (a view or column grants) via propose_sql and offers row-level security; says it hasn't run."

