id = "dba-32"
tags = ["migration", "mysql"]
message = "We just imported our old MySQL 5.7 database 'legacy'. Anything we should fix?"
context = "Database: legacy"
world = [
  { tool = "catalog", json = { db = "legacy", objects = [
    { name = "users", kind = "table", engine = "MyISAM", charset = "utf8mb3", rows = 120000 },
    { name = "posts", kind = "table", engine = "InnoDB", charset = "latin1", rows = 2400000 },
    { name = "tags", kind = "table", engine = "InnoDB", charset = "utf8mb4", rows = 900 },
  ] } },
]
calls = [
  { tool = "catalog", args = { db = "legacy" } },
  { tool = "propose_sql", args = { db = "legacy", sql = "ALTER TABLE users ENGINE=InnoDB, CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci", why = "MyISAM has no transactions or crash safety, and utf8mb3 can't store 4-byte characters." }, has = { sql = ["InnoDB", "utf8mb4"] } },
  { tool = "propose_sql", args = { db = "legacy", sql = "ALTER TABLE posts CONVERT TO CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci", why = "latin1 can't store most non-Western text or emoji." }, has = { sql = ["posts", "utf8mb4"] }, round = 2 },
]
answer = """
Two things:
1. `users` is MyISAM with utf8mb3 — no transactions, no crash safety, and SprigDB's features expect InnoDB. I proposed converting it to InnoDB and utf8mb4.
2. `posts` is latin1. I proposed converting it to utf8mb4; on 2.4M rows that rewrites the table, so run it off-peak.
