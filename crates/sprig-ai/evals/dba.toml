    { level = "change", at = "statement 3", object = "page_hits", rule = "engine", message = "ENGINE=MyISAM: every SprigDB table is InnoDB, so the table is created as InnoDB with a warning (it fails instead when compat.engine_substitution is reject). MyISAM's own behaviour, such as no transactions, doesn't carry over" },
    { level = "error", at = "statement 4", object = "devnull", rule = "engine", message = "ENGINE=BLACKHOLE isn't available: SprigDB tables hold their rows in InnoDB. Use InnoDB, or keep this data outside SprigDB", code = 3161 },
    { level = "note", at = "statement 1", object = "customers", rule = "auto_increment", message = "AUTO_INCREMENT values stay unique, but once the table is sharded they come from ID blocks shared by the gateways: not gap-free and not in insert order" },
    { level = "note", at = "statement 2", object = "orders", rule = "auto_increment", message = "AUTO_INCREMENT values stay unique, but once the table is sharded they come from ID blocks shared by the gateways: not gap-free and not in insert order" },
  ], groups = [{ root = "customers", key = "id", members = [{ table = "orders", key_column = "customer_id" }] }], reference = [], unsharded = [{ table = "page_hits", why = "nothing references it and it references nothing; the advisor decides from the workload" }], pins = ["SPRIG PIN customers SHARD KEY (id);", "SPRIG PIN orders COLOCATE WITH customers ON (customer_id);"], load_order = ["customers", "orders", "page_hits", "devnull"], plan = ["Take the dump with mysqldump --single-transaction --routines --triggers --events --set-gtid-purged=OFF --no-tablespaces", "Fix the errors below in the dump; 1 found.", "Load the schema through the MySQL persona (port 3306)", "Optional: run the 2 SPRIG PIN statements before loading", "Load the data in this order, parents first: customers, orders, page_hits, devnull."] } },
]
calls = [
  { tool = "migration_check", args = { source = "mysql", db = "shop", schema = "CREATE TABLE `customers` (`id` bigint NOT NULL AUTO_INCREMENT, `email` varchar(255) NOT NULL, PRIMARY KEY (`id`)) ENGINE=InnoDB;\nCREATE TABLE `orders` (`id` bigint NOT NULL AUTO_INCREMENT, `customer_id` bigint NOT NULL, `total` decimal(10,2), PRIMARY KEY (`id`), CONSTRAINT `fk_c` FOREIGN KEY (`customer_id`) REFERENCES `customers` (`id`)) ENGINE=InnoDB;\nCREATE TABLE `page_hits` (`id` bigint NOT NULL, `url` varchar(500), PRIMARY KEY (`id`)) ENGINE=MyISAM;\nCREATE TABLE `devnull` (`id` int NOT NULL, PRIMARY KEY (`id`)) ENGINE=BLACKHOLE;" }, has = { schema = ["BLACKHOLE"] } },
  { tool = "propose_sql", args = { db = "shop", sql = "SPRIG PIN customers SHARD KEY (id); SPRIG PIN orders COLOCATE WITH customers ON (customer_id)", why = "Keeps each customer's orders on the same shard as the customer, as the migration report suggests; optional, since the advisor would design groups itself.", estimate = "Metadata only; takes effect at the advisor's first design" }, has = { sql = ["SPRIG PIN", "COLOCATE"] } },
]
answer = """
The migration check found one blocker and one change:

- **`devnull` (ENGINE=BLACKHOLE) won't work** (3161): SprigDB tables always keep their rows in InnoDB. Drop it from the dump or make it InnoDB.
- **`page_hits` (ENGINE=MyISAM) becomes InnoDB** with a warning. That only gains you transactions, but don't rely on MyISAM behaviour.
- `AUTO_INCREMENT` on `customers` and `orders` stays unique, but once sharded the ids aren't gap-free.

Suggested layout: `customers` keyed by `id`, with `orders` co-located on `customer_id`. I proposed those two `SPRIG PIN` statements; they have not run, and they're optional — the sharding advisor would design groups from your workload anyway.

Plan: dump with `--set-gtid-purged=OFF --no-tablespaces`, fix `devnull`, load the schema through port 3306, then load data parents first (customers, orders, page_hits).
"""
must = ["BLACKHOLE", "InnoDB", "SPRIG PIN", "customer_id"]
must_any = [["hasn't run", "has not run", "not run"]]
rubric = "Runs migration_check on the pasted DDL, reports the BLACKHOLE table as a blocker and MyISAM as converted to InnoDB, explains the suggested customers/orders group, proposes the pins (saying they haven't run and are optional), and gives the import plan from the report without inventing findings."

[[case]]
id = "dba-52"
tags = ["migration", "mongodb"]
message = """We have a MongoDB app we'd like to move onto SprigDB. Collections:
[{"name":"events","options":{"timeseries":{"timeField":"ts"}}},{"name":"users","options":{"validator":{"$jsonSchema":{"bsonType":"object","required":["email"]}}},"indexes":[{"name":"_id_","key":{"_id":1}},{"name":"email_1","key":{"email":1},"unique":true},{"name":"all","key":{"$**":1}}]}]"""
context = "Database: app"
world = [
  { tool = "migration_check", json = { source = "mongodb", db = "app", collections = ["events", "users"], counts = { errors = 2, changes = 0, notes = 3 }, findings = [
    { level = "error", at = "collection events", rule = "timeseries", message = "Time-series collections aren't supported (39662): use an ordinary collection with an index on the time field, or a SprigDB stream", code = 39662 },
    { level = "note", at = "collection users", rule = "validator", message = "The validator is kept and checked on every write, as in MongoDB" },
    { level = "error", at = "collection users, index all", rule = "wildcard", message = "Wildcard indexes aren't supported (39662); index the paths queries use", code = 39662 },
    { level = "note", at = "collection users, index email_1", rule = "multikey", message = "If a key path holds arrays, the index doesn't index the elements (no multikey)" },
  ], plan = ["Dump with mongodump --db <source> (BSON keeps types).", "Fix the errors below.", "Restore through SprigDB's MongoDB listener with your tenant login", "Check: document counts per collection"] } },
]
calls = [
  { tool = "migration_check", args = { source = "mongodb", db = "app", schema = "[{\"name\":\"events\",\"options\":{\"timeseries\":{\"timeField\":\"ts\"}}},{\"name\":\"users\",\"options\":{\"validator\":{\"$jsonSchema\":{\"bsonType\":\"object\",\"required\":[\"email\"]}}},\"indexes\":[{\"name\":\"_id_\",\"key\":{\"_id\":1}},{\"name\":\"email_1\",\"key\":{\"email\":1},\"unique\":true},{\"name\":\"all\",\"key\":{\"$**\":1}}]}]" }, has = { schema = ["timeseries"] } },
]
answer = """
Two things need changing before the move (both would fail with 39662):

1. **`events` is a time-series collection**, which SprigDB doesn't support. Recreate it as an ordinary collection with an index on `ts` (or use a SprigDB stream).
2. **The wildcard index `all` on `users`** isn't supported. Replace it with indexes on the fields your queries actually filter on.

The rest carries over: the `$jsonSchema` validator on `users` is kept and checked on every write, and `email_1` stays unique. Then restore with `mongodump`/`mongorestore` through SprigDB's MongoDB listener.
"""
must = ["time-series", "wildcard", "39662"]
must_not = ["CREATE TABLE"]
rubric = "Runs migration_check with the collections, reports the time-series collection and the wildcard index as blockers with their fixes, says the validator and unique index carry over, and doesn't invent other findings."

[[case]]
id = "dba-53"
tags = ["schema-design", "check-ddl", "proposal"]
message = "Design the tables for room bookings: hotels, their rooms, and bookings of a room for a date range by a guest email."
context = "Database: travel"
world = [
  { tool = "check_ddl", json = { statements = 3, passed = true, counts = { errors = 0, changes = 0, notes = 0 }, findings = [], next = "It passes SprigDB's rules; propose it with propose_sql." } },
]
calls = [
  { tool = "check_ddl", args = { db = "travel", sql = "CREATE TABLE hotels (id BIGINT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(200) NOT NULL);\nCREATE TABLE rooms (id BIGINT PRIMARY KEY AUTO_INCREMENT, hotel_id BIGINT NOT NULL, number VARCHAR(16) NOT NULL, UNIQUE KEY uq_room (hotel_id, number), FOREIGN KEY (hotel_id) REFERENCES hotels (id));\nCREATE TABLE bookings (id BIGINT PRIMARY KEY AUTO_INCREMENT, hotel_id BIGINT NOT NULL, room_id BIGINT NOT NULL, guest_email VARCHAR(255) NOT NULL, starts_on DATE NOT NULL, ends_on DATE NOT NULL, KEY ix_room_dates (room_id, starts_on), FOREIGN KEY (room_id) REFERENCES rooms (id), CHECK (ends_on > starts_on))" }, has = { sql = ["CREATE TABLE", "bookings"] } },
  { tool = "propose_sql", args = { db = "travel", sql = "CREATE TABLE hotels (id BIGINT PRIMARY KEY AUTO_INCREMENT, name VARCHAR(200) NOT NULL);\nCREATE TABLE rooms (id BIGINT PRIMARY KEY AUTO_INCREMENT, hotel_id BIGINT NOT NULL, number VARCHAR(16) NOT NULL, UNIQUE KEY uq_room (hotel_id, number), FOREIGN KEY (hotel_id) REFERENCES hotels (id));\nCREATE TABLE bookings (id BIGINT PRIMARY KEY AUTO_INCREMENT, hotel_id BIGINT NOT NULL, room_id BIGINT NOT NULL, guest_email VARCHAR(255) NOT NULL, starts_on DATE NOT NULL, ends_on DATE NOT NULL, KEY ix_room_dates (room_id, starts_on), FOREIGN KEY (room_id) REFERENCES rooms (id), CHECK (ends_on > starts_on))", why = "Three tables for hotels, rooms and bookings; bookings carry hotel_id so a hotel's rooms and bookings can share a table group.", estimate = "Creates three empty tables" }, has = { sql = ["CREATE TABLE", "hotel_id"] } },
]
answer = """
Three tables, checked against SprigDB's rules (they pass):

- `hotels (id, name)`
- `rooms (id, hotel_id, number)`, unique per hotel
- `bookings (id, hotel_id, room_id, guest_email, starts_on, ends_on)`, with a check that the stay ends after it starts and an index on `(room_id, starts_on)` for availability lookups

`bookings` also holds `hotel_id`, so if SprigDB shards by hotel, a hotel's rooms and bookings stay on one shard. I proposed the DDL; it has not run.
"""
must = ["hotel_id", "bookings"]
must_any = [["hasn't run", "has not run", "not run"], ["checked", "check_ddl", "they pass", "passes"]]
rubric = "Writes plain DDL for the three tables, runs check_ddl before proposing, proposes it with propose_sql, explains key choices (unique room per hotel, date check, availability index, hotel_id for co-location), and says it hasn't run."

[[case]]
id = "dba-54"
tags = ["schema-design", "check-ddl", "storage"]
message = "Create a sessions table for us using ENGINE=MEMORY so it's fast: session id, user id, data, expiry."
context = "Database: app"
world = [
  { tool = "check_ddl", json = { statements = 1, passed = true, counts = { errors = 0, changes = 1, notes = 0 }, findings = [{ level = "change", at = "statement 1", object = "sessions", rule = "engine", message = "ENGINE=MEMORY: every SprigDB table is InnoDB, so the table is created as InnoDB with a warning (it fails instead when compat.engine_substitution is reject). MEMORY's own behaviour, such as no transactions, doesn't carry over" }], next = "It passes SprigDB's rules; propose it with propose_sql." } },
]
calls = [
  { tool = "check_ddl", args = { db = "app", sql = "CREATE TABLE sessions (id CHAR(64) PRIMARY KEY, user_id BIGINT NOT NULL, data JSON, expires_at DATETIME NOT NULL, KEY ix_expires (expires_at)) ENGINE=MEMORY" }, has = { sql = ["MEMORY"] } },
  { tool = "propose_sql", args = { db = "app", sql = "CREATE TABLE sessions (id CHAR(64) PRIMARY KEY, user_id BIGINT NOT NULL, data JSON, expires_at DATETIME NOT NULL, KEY ix_user (user_id), KEY ix_expires (expires_at))", why = "A plain InnoDB sessions table; MEMORY would be created as InnoDB anyway.", estimate = "Creates one empty table" }, has = { sql = ["sessions"] } },
]
forbid_sql = ["ENGINE=MEMORY"]
answer = """
SprigDB keeps every table in InnoDB, so `ENGINE=MEMORY` would be created as InnoDB with a warning (and refused if `compat.engine_substitution` is `reject`). It wouldn't be faster, and its rows would survive restarts.

I proposed a plain InnoDB `sessions` table with indexes on `user_id` and `expires_at` (for cleaning up expired sessions). It has not run. If you want a fast key-value store for sessions, SprigDB's Redis front end is another option.
"""
must = ["InnoDB", "expires_at"]
must_any = [["hasn't run", "has not run", "not run"]]
rubric = "Checks the DDL, explains MEMORY becomes InnoDB on SprigDB, proposes the table without the MEMORY engine, says it hasn't run."

