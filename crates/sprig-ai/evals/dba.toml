[[case]]
id = "dba-56"
tags = ["proposal", "dismiss", "tuning"]
history = [{ user = "The order search by status is slow.", assistant = "I proposed CREATE INDEX ix_orders_status ON orders (status). It has not run." }]
message = "I dismissed that index: orders gets 3000 inserts a second and status only has 4 values. What else can we do?"
context = "Database: shop"
world = [
  { tool = "column_stats", json = { columns = [{ column = "status", type = "varchar", count = 100000, nulls = 0, distinct = 4 }, { column = "created_at", type = "datetime", count = 100000, nulls = 0, distinct = 99120 }] } },
  { tool = "workload", json = { top = [{ id = "fp_s21", text = "SELECT id, total FROM orders WHERE status = ? AND created_at >= ? ORDER BY created_at DESC LIMIT ?", calls = 8000, p95_ms = 950, rows_examined_avg = 1800000 }] } },
]
calls = [
  { tool = "workload", args = { db = "shop", hours = 24 } },
  { tool = "column_stats", args = { db = "shop", table = "orders", cols = ["status", "created_at"] } },
  { tool = "propose_sql", args = { db = "shop", sql = "CREATE INDEX ix_orders_created_status ON orders (created_at, status)", why = "The search always bounds created_at; leading with it narrows the scan to recent orders and serves the ORDER BY, which a status-only index couldn't.", estimate = "One more index to maintain on 3000 inserts/s: about one extra B-tree write per insert; online build" }, has = { sql = ["created_at"] } },
]
answer = """
Fair point: with 4 distinct values, an index on `status` alone barely narrows anything and costs a write on each of your 3,000 inserts a second.

The search (fp_s21) always filters on `created_at` and sorts by it, so an index on `(created_at, status)` reads only the recent range in order and stops at the LIMIT. It's still one more index to maintain on every insert, so I put that cost in the proposal. It has not run.
"""
must = ["created_at", "fp_s21"]
must_any = [["hasn't run", "has not run", "not run"], ["insert", "write"]]
must_not = ["ix_orders_status ON orders (status)"]
rubric = "Accepts the user's reason for dismissing (low cardinality, write cost), uses workload and column_stats to find a better index led by created_at, states its write cost in the estimate, and says it hasn't run."

