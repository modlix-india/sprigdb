apiVersion: v2
name: sprigdb
description: SprigDB for one data center; install once per DC's Kubernetes cluster.
type: application
version: 0.1.0
appVersion: "0.0.1"
license: Apache-2.0
home: https://github.com/modlix-india/sprigdb
kubeVersion: ">=1.27.0-0"
annotations:
  # Storage engine nodes (node.enabled, templates/node.yaml) need cert-manager
  # and trust-manager. mariadb-operator (k8s.mariadb.com/v1alpha1) is needed
  # only for values.pools, the MariaDB-backed clusters from before the
  # storage engine; set `pools: []` to install without it. This chart installs
  # none of them.
  sprigdb.io/requires: "cert-manager, trust-manager; mariadb-operator only with values.pools"
