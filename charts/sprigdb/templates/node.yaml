{{- /* Storage engine nodes (node.enabled): a StatefulSet on local volumes,
     each pod one Raft node whose id is its ordinal + 1. Tenants' units are
     placed on three nodes in distinct zones (failure domain = the
     Kubernetes node's zone label, read at start). Pods are replaced one at
     a time by whoever drives an upgrade (updateStrategy OnDelete; `sprigctl
     node rollout` or the operator), and a stopping pod first hands the
     units it leads to other voters (SIGTERM does that; the preStop hook
     only waits for it). A pod gone longer than
     replication.dead_node_minutes has its units re-replicated on the
     others. */}}
{{- if .Values.node.enabled }}
{{- $n := int .Values.node.replicas }}
{{- $ns := .Release.Namespace }}
{{- $listeners := .Values.gateway.listeners | default dict }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sprigdb-node
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  serviceName: sprigdb-node-pods
  replicas: {{ $n }}
  podManagementPolicy: Parallel
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app.kubernetes.io/component: node}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: node
        {{- include "sprigdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.node.terminationGracePeriodSeconds }}
      {{- include "sprigdb.podSecurity" . | nindent 6 }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/component: node}
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app.kubernetes.io/component: node}
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: node
          image: {{ include "sprigdb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Raft id = ordinal + 1; peers by their stable pod names, resolved
          # at start (the Raft transport takes addresses).
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ord="${POD_NAME##*-}"
              export SPRIGDB_ENGINE_RAFT_ID=$((ord + 1))
              peers=""
              i=0
              while [ "$i" -lt {{ $n }} ]; do
                host="sprigdb-node-$i.sprigdb-node-pods.{{ $ns }}.svc"
                ip=""
                while [ -z "$ip" ]; do
                  ip="$(getent hosts "$host" | awk '{print $1; exit}')" || true
                  [ -n "$ip" ] || sleep 1
                done
                peers="${peers:+$peers,}$((i + 1))=$ip:{{ .Values.node.raftPort }}"
                i=$((i + 1))
              done
              export SPRIGDB_ENGINE_RAFT_PEERS="$peers"
              export SPRIGDB_ENGINE_RAFT_LISTEN="0.0.0.0:{{ .Values.node.raftPort }}"
              export SPRIGDB_GATEWAY_ADVERTISE_ADDR="$POD_NAME.sprigdb-node-pods.{{ $ns }}.svc"
              exec /usr/bin/sprigdb gateway --config /etc/sprigdb/config/sprigdb.toml
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: SPRIGDB_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: SPRIGDB_ENGINE_DIR, value: /var/lib/sprigdb/engine}
            - {name: SPRIGDB_ENGINE_MB, value: {{ .Values.node.engineMb | quote }}}
            - {name: SPRIGDB_ENGINE_PLACEMENT, value: "on"}
            {{- if .Values.node.failureDomain }}
            - {name: SPRIGDB_ENGINE_FAILURE_DOMAIN, value: {{ .Values.node.failureDomain | quote }}}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - {name: SPRIGDB_ENGINE_RAFT_TLS_DIR, value: /etc/sprigdb/raft-tls}
            {{- end }}
          ports:
            - {name: mysql, containerPort: 3306}
            - {name: mariadb, containerPort: 3307}
            - {name: http, containerPort: 8080}
            - {name: https, containerPort: 8443}
            {{- range $name := splitList "," (include "sprigdb.optionalListeners" .) }}
            {{- $l := get $listeners $name | default dict }}
            {{- if $l.enabled }}
            - {name: {{ $name }}, containerPort: {{ $l.port }}}
            {{- end }}
            {{- end }}
            - {name: peer, containerPort: 7403}
            - {name: raft, containerPort: {{ .Values.node.raftPort }}}
            - {name: telemetry, containerPort: 9180}
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
          livenessProbe:
            httpGet: {path: /healthz, port: telemetry}
            periodSeconds: 5
            failureThreshold: 6
          lifecycle:
            # SIGTERM hands the units this node leads to other voters, then
            # drains sessions; nothing to do before it.
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 1"]}
          resources: {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            {{- include "sprigdb.tlsMounts" . | nindent 12 }}
            - {name: data, mountPath: /var/lib/sprigdb}
            - {name: backends, mountPath: /etc/sprigdb/backends, readOnly: true}
            {{- if .Values.tls.enabled }}
            - {name: raft-tls, mountPath: /etc/sprigdb/raft-tls, readOnly: true}
            {{- end }}
      volumes:
        {{- include "sprigdb.tlsVolumes" (dict "root" . "role" "gateway" "secret" "sprigdb-node-tls") | nindent 8 }}
        - name: backends
          secret: {secretName: sprigdb-gateway-backends, optional: true}
        {{- if .Values.tls.enabled }}
        - name: raft-tls
          secret: {secretName: {{ .Values.node.raftTlsSecret }}}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.node.storage.storageClassName }}
        storageClassName: {{ .Values.node.storage.storageClassName }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.node.storage.size }}}
---
# Headless: a stable DNS name per node pod, published before it is ready
# (Raft peers find each other while starting). It also publishes each
# pod's telemetry for the ServiceMonitor, a starting node's included.
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-node-pods
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/component: node}
  ports:
    - {name: peer, port: 7403}
    - {name: raft, port: {{ .Values.node.raftPort }}}
    - {name: telemetry, port: 9180}
---
# Clients: any node accepts any connection and hands it to the tenant's
# leader.
apiVersion: v1
kind: Service
metadata:
  name: sprigdb-node
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.node.service.type }}
  selector: {app.kubernetes.io/component: node}
  ports:
    - {name: mysql, port: 3306}
    - {name: mariadb, port: 3307}
    - {name: http, port: 8080}
    - {name: https, port: 8443}
    {{- range $name := splitList "," (include "sprigdb.optionalListeners" .) }}
    {{- $l := get $listeners $name | default dict }}
    {{- if $l.enabled }}
    - {name: {{ $name }}, port: {{ $l.port }}}
    {{- end }}
    {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sprigdb-node
  labels: {{- include "sprigdb.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/component: node}
{{- end }}
