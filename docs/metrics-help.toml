sprig_vector_search_duration_seconds = "Duration of vector searches; `plan` is the search plan, such as exact or approximate. Unit: seconds."
sprig_vector_searches_total = "Vector searches; `plan` is the search plan. Unit: count."
sprig_workload_fingerprints_active = "Statement fingerprints the gateway's workload recorder holds in memory (limit `workload.max_fingerprints_per_tenant` per tenant). Unit: count."
sprig_workload_flush_deferred_total = "Workload rows the recorder dropped because it couldn't flush them in time. Unit: count."
sprig_workload_flush_duration_seconds = "Duration of one workload flush from a gateway to the tenant catalogs. Unit: seconds."
sprig_workload_flush_gone_dropped_total = "Workload rows (first sightings, statistics, samples) dropped because their tenant was deleted, instead of kept for the next flush. Unit: count."
sprig_workload_flush_late_dropped_total = "Closed workload buckets dropped because the rollup may already have merged them. Unit: count."
sprig_workload_flush_rows_total = "Workload rows (statistics, fingerprints, samples) flushed to tenant catalogs. Unit: count."
sprig_workload_memory_bytes = "Memory the gateway's workload recorder uses (limit `workload.max_memory_mb`). Unit: bytes."
sprig_workload_other_total = "Executions counted under the catch-all `other` fingerprint because the per-tenant fingerprint limit was reached. Unit: count."
sprig_workload_probes_run_total = "Rows-examined probes that completed on a backend connection. Unit: count."
sprig_workload_probes_total = "Rows-examined probes the workload recorder planned. Unit: count."
sprig_workload_rollup_duration_seconds = "Duration of one tenant's workload rollup and retention run. Unit: seconds."
sprig_workload_rollup_merged_total = "Workload rows merged by the rollup. Unit: count."
sprig_workload_samples_kept_total = "Parameter samples sealed and kept for index replay. Unit: count."
sprig_workload_samples_skipped_total = "Parameter samples not kept because no sealing key was available. Unit: count."
sprig_workload_samples_total = "Parameter samples the workload recorder took (`workload.sample_rate`). Unit: count."
sprig_workload_samples_unopened_total = "Sealed parameter samples a replay couldn't open, for example after a key change. Unit: count."

# Not recorded by this build; kept for when they are. The generator lists
# only metrics the code records.

sprig_advisor_runs_total = "Periodic sharding-advisor runs for tenants whose tables are in table groups, one per tenant every `advisor.interval_hours`, each scoring the best re-key of a group; `cause` is `periodic`, `verdict` is `apply`, `recommend`, `wait` or `no_change`. Unit: count."
sprig_gateway_session_panics_total = "Client session tasks that panicked; the gateway logs the panic and closes that connection. `protocol` is `mysql`, `mariadb`, `mongo`, `redis`, `http`, `bolt`, `kafka` or `amqp`. Should stay at 0. Unit: count."
sprig_gateway_traffic_reports_total = "Traffic reports this gateway sent to tenants' home data centres for data-centre placement, one per home data centre every `routing.traffic_report_seconds`, with each tenant's reads and writes by client data centre; `result` is `ok`, or `failed` when the counts are kept for the next report. Unit: count."
sprig_graph_mirror_fallbacks_total = "Graph statements whose incoming hops couldn't use an asynchronously kept graph mirror and read every shard instead; `reason` is `lag` (the mirror hadn't caught up for a read) or `write` (a write statement, which never reads an asynchronous mirror). Unit: count."
sprig_lookup_orphans_removed_total = "Orphan entries removed from unique lookup indexes, whose owner row no longer exists, by the orphan scan that runs every `lookup.orphan_scan_hours` and after a lookup index is rebuilt. Unit: count."
sprig_sink_script_seconds = "Time a script sink's script took to handle one batch, its reads through the `db` handle included; `language` is `javascript`, `kirun` or `lua`. Unit: seconds."
