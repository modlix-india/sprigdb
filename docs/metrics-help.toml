# One-line descriptions of SprigDB metrics, merged into
# docs/reference/metrics.md by `cargo run -p sprig-docs-gen`. Every metric the
# code records has one: what it measures, its labels, and its unit.

sprig_advisor_autoindex_build_seconds = "Time to build one automatic index across its shards; `method` is the build method used. Unit: seconds."
sprig_advisor_autoindex_candidates_total = "Index candidates the automatic-indexing evaluation recorded; `status` is the candidate's status, `skipped` when no candidate could be designed. Unit: count."
sprig_advisor_autoindex_churn_total = "Automatic index definitions created again within 30 days of being dropped, a sign of flapping. Unit: count."
sprig_advisor_autoindex_drops_total = "Automatic indexes dropped; `reason` is why, such as unused, regressed or `failed_rollout`. Unit: count."
sprig_advisor_autoindex_pass_timeouts_total = "Automatic-indexing passes for a tenant cut off by the controller because they ran past their time budget. Unit: count."
sprig_advisor_autoindex_runs_total = "Automatic-indexing evaluation runs, one per tenant evaluation. Unit: count."
sprig_advisor_autoindex_validation_leftovers_total = "Indexes and helper columns left on replicas or Galera nodes by interrupted validations, then dropped by the clean-up. Unit: count."
sprig_advisor_rekeys_total = "Online re-keys of table groups; `outcome` is `started` or `finished`. Unit: count."
sprig_agent_fenced = "Whether the node agent has fenced its MariaDB node (`read_only` on, sessions killed) because it lost its writer lease or permit; `cluster` is the node's cluster. Unit: 0 or 1."
sprig_agent_relay_takeovers_total = "Times this node agent took its Galera cluster's Sprig 2PC relay lease and, after recovering every held branch on its node, became the relay writer; `cluster` is the node's cluster. Unit: count."
sprig_agent_relay_writer = "Whether this node agent is its Galera cluster's ready Sprig 2PC relay writer (it holds the relay lease and has recovered the node's held branches); `cluster` is the node's cluster. Unit: 0 or 1."
sprig_agent_writer_lease_remaining_seconds = "Time left on the writer lease the node agent holds for its MariaDB node; `cluster` is the node's cluster. Unit: seconds."
sprig_ai_budget_stops_total = "AI assistant turns stopped because the tenant's or the user's daily token budget was used up (`ER_SPRIG_AI_BUDGET_EXCEEDED`). Unit: count."
sprig_ai_feedback_total = "Thumbs up or down users gave AI assistant answers (`POST /v1/ai/feedback`); `role` is the assistant, `vote` is `up` or `down`. Unit: count."
sprig_ai_egress_reduced_total = "Tool results the AI egress gate reduced before they reached the provider: rows or values withheld because `ai.share_data` is off, or a result cut at 200 rows or 64 KiB; `role` is the assistant. Unit: count."
sprig_ai_embedding_backlog = "Changed rows of embedded columns the worker's embedding jobs have read from the change feed and not yet written. Unit: rows."
sprig_ai_embedding_cutovers_total = "Re-embeddings of embedded columns swapped into place after a model or source change; `result` is `done` or `failed` (retried). Unit: count."
sprig_ai_embedding_rows_total = "Rows the embedding worker handled for embedded columns; `model` is the model alias, `result` is `embedded`, `cleared` (no source: the vector became NULL), `skipped` (already the current source's) or `superseded` (the row changed again before the write). Unit: rows."
sprig_ai_embedding_seconds = "Time of one model batch of the embedding worker (embedded columns and retrieval indexes); `model` is the model alias. Unit: seconds."
sprig_ai_fn_calls_total = "Distinct inputs the AI functions in statements answered (`AI_EMBED`, `AI_CLASSIFY`, ... and their MongoDB operators); `fn` is `embed`, `classify`, `extract`, `summarize` or `complete`, `model` is the model used, `cached` is `true` for answers from the function cache. Unit: count."
sprig_ai_health_findings_total = "Findings of the administration agent's health rules over its metric history, one per finding per check; `rule` is `shard_split`, `cluster_full`, `replica_lag`, `cluster_health`, `connections`, `backup_age` or `mover_backlog`. Unit: count."
sprig_ai_health_warnings_total = "Health warnings the administration agent filed in the approvals inbox (`ai_health_warning`); `worded` is `model`, or `rules` when no model was available and the rule's own words were filed. Unit: count."
sprig_ai_history_samples_total = "Sampling passes of the administration agent's metric history on the data center's leading controller, while `ai.admin.enabled` is on; `result` is `ok` or `error`. Unit: count."
sprig_ai_incident_triage_total = "Incidents the administration agent sent to triage; `verdict` is `noise`, `needs_advice`, or `critical` when triage was skipped for a critical code. Unit: count."
sprig_ai_incidents_held_total = "Incidents from the error intake that had to wait in a pass; `reason` is `advice_cap` (`ai.admin.max_advice_hour`), `triage_cap` (`ai.admin.max_triage_hour`), `budget` (a daily token budget is spent), `no_model` (`ai.model.admin` is empty), `error` (triage or advice failed) or `expired` (waited a day). Unit: count."
sprig_ai_incidents_total = "Advice items the administration agent filed in the approvals inbox (`ai_incident_advice`); `severity` is `low`, `medium`, `high` or `critical`. Unit: count."
sprig_ai_intake_flushes_total = "Writes of a process's error counts to etcd for the administration agent, while `ai.admin.enabled` is on; `result` is `ok` or `error`. Unit: count."
sprig_ai_mcp_requests_total = "Requests to the MCP server (`/v1/mcp`); `method` is `initialize`, `server/discover`, `tools/list`, `tools/call`, `ping`, `notification`, `delete` or `other`, `result` is `ok`, `error` (a JSON-RPC error after sign-in) or `refused` (signed out, turned off, malformed or from another origin). Unit: count."
sprig_ai_mcp_tool_calls_total = "Tool calls MCP clients made; `role` is `data` or `dba`, `tool` is the tool (`other` for a name not offered), `result` is `ok`, `error`, `denied` (not offered, or invalid input), `proposed` or `limited` (over `ai.mcp.calls_per_minute`). Unit: count."
sprig_ai_payloads_purged_total = "Exact payloads sent to AI providers that the controller dropped from conversations after `ai.audit_payload_days`; their SHA-256 hashes stay. Unit: count."
sprig_ai_proposals_total = "Proposals the AI assistants made, and what became of them; `kind` is `sql`, `recommendation`, `tile`, `glossary` or `generate_rows`, `outcome` is `shown` when made, then `accepted`, `dismissed` or `failed` as users report it with `POST /v1/ai/feedback`. Unit: count."
sprig_ai_requests_total = "Calls to an AI provider; `role` is the assistant, `provider` and `model` as configured in `ai.model.<role>`, `result` is `ok`, `refused` or `error` (after retries). Unit: count."
sprig_ai_tokens_total = "Tokens AI providers reported; `role` is the assistant, or `functions` for the AI functions in statements, `direction` is `input` (uncached), `output`, `cache_read` or `cache_write`. Unit: tokens."
sprig_ai_tool_calls_total = "Tool calls made by the AI assistants; `tool` is the tool, `result` is `ok`, `error`, `denied` (outside the role or invalid input) or `proposed`. Unit: count."
sprig_ai_turn_seconds = "Duration of one AI assistant turn, model calls and tools together; `role` is the assistant. Unit: seconds."
sprig_ai_upgrade_checks_total = "Upgrade readiness checks (`sprigctl ai upgrade-check`, `POST /admin/v1/ai:upgradeCheck`); `result` is `ok` or `error`. Unit: count."
sprig_ai_digests_total = "Tenant digests built (`ai.digest`); `result` is `worded` (the facts and the model's words), `facts` (the facts alone: no model, a spent budget or a failed call) or `error` (the facts couldn't be read or stored). Unit: count."
sprig_ai_digest_emails_total = "Tenant digests emailed to approvals subscribers (`ai.digest_email`); `result` is `sent`, `skipped` (no SMTP server or no subscriber) or `failed`. Unit: count."
sprig_ai_writeups_total = "Incident write-ups of failovers, failed data moves and incidents; `result` is `drafted`, `held` (no administration model) or `failed`. Unit: count."
sprig_amqp_auth_failures_total = "AMQP logins refused; `mechanism` is the SASL mechanism the client used, such as `PLAIN`. Unit: count."
sprig_amqp_channels = "AMQP 0-9-1 channels open on this gateway. Unit: count."
sprig_amqp_connections = "AMQP connections open on this gateway; `protocol` is the protocol version detected from the header (0-9-1 or 1.0). Unit: count."
sprig_amqp_protocol_header_refused_total = "AMQP connections refused at the protocol header; `header` is what the client sent (a version not offered, or unknown). Unit: count."
sprig_api_change_events_sent_total = "Change events the gateway sent to REST, gRPC and WebSocket change-stream clients. Unit: count."
sprig_api_change_stream_slow_total = "Change streams ended because the client fell more than `api.stream.max_buffered_events` behind (`ER_SPRIG_STREAM_SLOW_CONSUMER`). Unit: count."
sprig_api_change_streams = "Change streams open on this gateway over the API. Unit: count."
sprig_api_change_streams_forwarded_total = "Change streams of tenants homed in another data centre, relayed from a gateway there; `outcome` is `opened`, `refused` (the home gateway refused it, as for a bad credential) or `unavailable` (no gateway there answered). Unit: count."
sprig_api_open_transactions = "REST and gRPC transactions (transaction handles) open on this gateway. Unit: count."
sprig_api_request_duration_seconds = "Duration of HTTP API requests on this gateway; `protocol` is `rest` or `grpc`. Unit: seconds."
sprig_api_requests_total = "HTTP API calls; `service` is the API service, `method` its method, `protocol` `rest` or `grpc`. Unit: count."
sprig_api_results_truncated_total = "API query results cut short at the request's `max_rows` or `max_bytes`. Unit: count."
sprig_api_transactions_expired_total = "REST and gRPC transactions rolled back for passing `api.txn.idle_timeout_ms` or `api.txn.max_lifetime_ms`. Unit: count."
sprig_api_txn_forwarded_total = "API calls forwarded to the gateway that owns their transaction handle. Unit: count."
sprig_approvals_actions_total = "Actions taken on recommendations; `kind` is the recommendation kind, `action` is approve, ignore, snooze, reopen, comment, auto_apply, escalate, expire or emergency. Unit: count."
sprig_approvals_applied_total = "Approved recommendations applied; `kind` is the recommendation kind, `result` is `ok` or `failed`. Unit: count."
sprig_approvals_decision_seconds = "Time from a recommendation being raised to its approval or dismissal; `kind` is the recommendation kind. Unit: seconds."
sprig_approvals_notifications_total = "Approval notifications; `channel` is email, webhook or stream, `result` is sent, failed or skipped. Unit: count."
sprig_approvals_oldest_open_seconds = "Age of the oldest recommendation still waiting; `kind` is the recommendation kind, `level` its level (tenant, data centre or global). Unit: seconds."
sprig_approvals_open = "Recommendations waiting for a decision or to be applied; `kind` and `level` as above. Unit: count."
sprig_approvals_raised_total = "Recommendations raised or raised again; `kind` is the recommendation kind, `level` its level. Unit: count."
sprig_approvals_suppressed_total = "Proposals not raised because an earlier ignore covers them; `kind` is the recommendation kind. Unit: count."
sprig_audit_dropped_total = "Audit events dropped because both the disk spool and the memory buffer were full; `stream` is the audit stream. Should stay at 0. Unit: count."
sprig_audit_events_total = "Audit events recorded; `stream` is the audit stream (tenant or platform). Unit: count."
sprig_audit_retention_removed_total = "Day directories of this process's local audit log removed by the hourly retention pass because they were older than `audit.retention_days`. Unit: count."
sprig_audit_ship_failures_total = "Failed attempts to ship spooled audit events to their destination. Unit: count."
sprig_audit_spool_bytes = "Audit events waiting in the local spool. Unit: bytes."
sprig_audit_spool_max_bytes = "The audit spool's size limit (`audit.spool_max_mb`); when the spool reaches it, audited changes fail closed. Unit: bytes."
sprig_auth_audit_events_total = "Authentication audit events, such as logins, lockouts and grants; `event` is the event name. Unit: count."
sprig_auth_auto_unlocks_total = "Accounts unlocked automatically when their temporary lock (`auth.password_lock_minutes`) expired. Unit: count."
sprig_auth_checks_total = "Privilege checks that denied a statement; `protocol` is the front end, `result` is `deny`. Unit: count."
sprig_auth_compiles_total = "Privilege sets compiled for sessions, on a cache miss. Unit: count."
sprig_auth_drift_corrections_total = "Backend grant reconciliations that had to correct drift in MariaDB grants; `cluster` is the cluster. Unit: count."
sprig_auth_fast_cache_total = "Lookups in the login fast cache used by `caching_sha2_password` and HTTP Basic; `result` is `hit`, `miss` or `mismatch`. Misses need a full authentication, which over MySQL requires TLS. Unit: count."
sprig_auth_handoffs_total = "Logins handed to the tenant's home data centre to decide; `outcome` is `decided`, `denied`, `misrouted`, `unreachable` or `not_relayable` (a SCRAM or certificate-only login refused outside the tenant's allowed data centres). Unit: count."
sprig_auth_impersonations_total = "Impersonation sessions started by administrators in Studio. Unit: count."
sprig_auth_jwks_fetches_total = "Fetches of identity provider key sets (JWKS), for logins with their tokens; `outcome` is `ok` or `error`. A failing issuer's cached keys serve up to twice `auth.jwks_refresh_seconds`, then its tokens are refused. Unit: count."
sprig_auth_lockouts_total = "Accounts temporarily locked after `auth.failed_login_attempts` failures in a row. Unit: count."
sprig_auth_logins_total = "Login attempts; `protocol` is the front end, `mechanism` the authentication method (`jwt` for an identity provider's token over HTTP, gRPC and MongoDB), `outcome` is `ok`, `sandbox` (expired password) or the refusal reason, such as `bad_credentials`. Unit: count."
sprig_auth_mfa_total = "Second-factor checks; `method` is the factor (such as TOTP or a recovery code), `outcome` is `ok` or `failed`. Unit: count."
sprig_auth_rate_limited_total = "Logins slowed or refused for repeated failures; `scope` is `ip` (address blocked, 39300) or `account` (failure delay applied). Unit: count."
sprig_auth_reconcile_duration_seconds = "Time to reconcile a tenant's backend MariaDB accounts and grants on a cluster; `cluster` is the cluster. Unit: seconds."
sprig_auth_reconcile_statements_total = "Grant and account statements the reconciler ran on MariaDB to match the catalog. Unit: count."
sprig_auth_revocations_total = "Sessions or tokens revoked; `reason` is why, such as a dropped or locked account. Unit: count."
sprig_auth_tokens_issued_total = "SprigDB session tokens issued; `kind` is the token kind, such as access or refresh. Unit: count."
sprig_auth_verifier_backfills_total = "SCRAM password verifiers stored at login for accounts that lacked them; `outcome` is `ok` or `error`. Unit: count."
sprig_backend_connects_total = "New connections the gateway opened to MariaDB; `cluster` is the cluster, `outcome` `ok` or `error`. Unit: count."
sprig_backend_failures_total = "Failures talking to MariaDB on live traffic; `cluster` is the cluster, `kind` the failure (such as lost or connect). Enough failures mark a node down. Unit: count."
sprig_backend_gtid_reads_total = "Extra reads of `@@last_gtid` after commits whose reply didn't carry the GTID, needed for read-your-writes; `cluster` is the cluster. Unit: count."
sprig_backend_gtid_wait_seconds = "Time reads waited for a replica to catch up to the session's last write before running there; `cluster` is the cluster. Unit: seconds."
sprig_backend_gtid_wait_timeouts_total = "Reads whose wait for a replica to catch up timed out or failed, so they ran on the writer instead; `cluster` is the cluster. Unit: count."
sprig_backend_node_behind = "Whether a replica or Galera node is too far behind to receive reads (`reads.max_replica_lag_ms`); `cluster` and `node` identify it. Unit: 0 or 1."
sprig_backend_node_up = "Whether the gateway considers a MariaDB node reachable; `cluster` and `node` identify it. Unit: 0 or 1."
sprig_backend_pins_total = "Times a session was pinned to one backend connection because it holds state that can't move; `cluster` is the cluster, `reason` is `transaction`, `temp_tables`, `table_locks`, `user_locks`, `cursor`, `handler`, `client_xa`, `untracked` or `session_mode`. Unit: count."
sprig_backend_pool_connections = "Pooled connections from this gateway to MariaDB; `cluster` is the cluster, `state` is `idle` or `leased`. Unit: count."
sprig_backend_pool_wait_seconds = "Time statements waited for a pooled backend connection; `cluster` is the cluster. Unit: seconds."
sprig_backend_prepared_evictions_total = "Server-side prepared statements closed on MariaDB to stay within the per-connection budget (`backend.prepared_budget_pct`); `cluster` is the cluster. Unit: count."
sprig_backend_reads_total = "Reads routed by the gateway; `cluster` is the cluster, `target` is where the read ran (writer, replica or Galera node), `causal` whether it had to see earlier writes. Unit: count."
sprig_backend_replica_lag_seconds = "Replication lag of a replica or Galera node as the gateway measures it; `cluster` and `node` identify it. Unit: seconds."
sprig_backend_silent_aborts_total = "Transactions Galera rolled back while answering OK to a statement; the gateway answers 1213 (deadlock) instead. `cluster` is the cluster. Unit: count."
sprig_backend_state_syncs_total = "Times session state (variables, database, character set) was captured or replayed on a backend connection; `cluster` is the cluster, `kind` the operation. Unit: count."
sprig_backend_wrapped_commit_failures_total = "Autocommit writes on connections through a Sprig 2PC relay whose separate `COMMIT` failed, so the client got the commit's error instead of the write's answer; `cluster` is the backend cluster. Unit: count."
sprig_backend_writer_changes_total = "Times the gateway saw a cluster's writer move to another node; `cluster` is the cluster. Unit: count."
sprig_backup_last_success_timestamp_seconds = "When the newest successful backup of each cluster finished, as the backup tool or the Kubernetes operator recorded it; the controllers read the records once a minute and the `BackupMissed` alert watches this gauge. `cluster` is the cluster, `kind` the backup kind, such as `full`. Unit: Unix time in seconds."
sprig_balancer_blocked_total = "Balancer moves held back by a guardrail; `guardrail` names it, such as a cooldown or a concurrency limit. Unit: count."
sprig_balancer_cluster_full_ratio = "How full a cluster is on its tightest resource, as the balancer sees it; `cluster` is the cluster, `dimension` the bottleneck (such as storage or CPU). Unit: ratio (1 is full)."
sprig_balancer_constraint_violations = "Placement constraint violations in the balancer's current view of the data centre; the balancer keeps it at 0. Unit: count."
sprig_balancer_jobs_waiting_total = "Shard jobs (splits, merges, moves) the controller held back; `blocked_by` is what they wait for, such as `limit`, `ddl` or `index`. Unit: count."
sprig_balancer_load_reports_total = "Load reports from gateways that the data centre's leading controller read for placement and hot-shard detection. Unit: count."
sprig_balancer_moves_reverted_total = "Balancer moves that undid an earlier move (thrashing); `after_recovery` is `true` when the reversal followed a cluster's recovery. Unit: count."
sprig_balancer_moves_total = "Moves the balancer decided; `reason` is why (such as relieving a hot cluster or spreading load), `outcome` what became of it. Unit: count."
sprig_balancer_plan_duration_seconds = "Time of one balancer planning pass in the data centre. Unit: seconds."
sprig_balancer_recommendations = "Balancer recommendations waiting for approval; `kind` is the recommendation kind. Unit: count."
sprig_balancer_shard_jobs_total = "Split, merge and move jobs the controller submitted for sharding; `kind` is the job kind, `outcome` how it ended. Unit: count."
sprig_balancer_shard_schemas = "Shard schemas on each cluster; `cluster` is the cluster. Compare with `placement.max_shard_schemas_per_cluster`. Unit: count."
sprig_balancer_shard_size_bytes = "Sizes of shards measured by the sharding loop when deciding splits and merges. Unit: bytes."
sprig_binlog_events_total = "Binlog events decoded by SprigDB's binlog readers (moves, change feed); `type` is the event type. Unit: count."
sprig_binlog_reconnects_total = "Times a move's binlog stream or apply failed and the mover reopened it from the last position. Unit: count."
sprig_bolt_auth_total = "Bolt (Neo4j protocol) logins; `scheme` is the authentication scheme, `result` is `ok` or `refused`. Unit: count."
sprig_bolt_bookmark_waits_total = "Bolt reads with a bookmark that waited for a replica to catch up; `outcome` says whether the replica caught up or the read stayed on the writer. Unit: count."
sprig_bolt_connections = "Bolt connections open on this gateway; `version` is the negotiated Bolt version. Unit: count."
sprig_bolt_keepalives_total = "Keep-alive (NOOP) chunks the gateway sent on Bolt connections while a request ran, one every half `bolt.recv_timeout_seconds`, so drivers wait for long statements. Unit: count."
sprig_bolt_messages_total = "Bolt protocol messages; `message` is the message name, `result` how it was handled (such as `sent` or `ignored` after a failure). Unit: count."
sprig_catalog_cache_bytes = "Memory used by this process's cache of tenant catalogs (`catalog.cache_max_mb`). Unit: bytes."
sprig_catalog_cache_tenants = "Tenants whose catalogs are cached in this process (`catalog.cache_max_tenants`). Unit: count."
sprig_catalog_changes_total = "Catalog changes committed (DDL, settings, accounts); `kind` is the kind of change. Unit: count."
sprig_catalog_load_seconds = "Time to load a tenant's catalog into the cache. Unit: seconds."
sprig_catalog_loads_total = "Tenant catalog loads into the cache; `kind` is `full` or `incremental`, `source` the node read from, `outcome` the result. Unit: count."
sprig_catalog_reconcile_findings_total = "Problems the catalog reconciler found, such as stuck states or orphan schemas; `finding` names the kind. Unit: count."
sprig_catalog_version_lag_seconds = "How long the most-behind cached tenant catalog has known of a newer version than it holds. Unit: seconds."
sprig_cluster_capability_changes_total = "Changes in a cluster's capability profile seen by the probes; `dc` and `cluster` identify it, `field` is the capability, `direction` `upgrade`, `downgrade` or `changed`. Unit: count."
sprig_cluster_health_state = "Health of each cluster as the controller's monitor judges it: 0 healthy, 1 degraded, 2 no writer, 3 unknown. Labelled by `dc` and `cluster`. Unit: state code."
sprig_cluster_probe_duration_seconds = "Duration of cluster probes; `probe` is the probe (`binlog_dump` for the binlog check), others are labelled by `dc` and `cluster`. Unit: seconds."
sprig_cluster_probe_failures_total = "Failed cluster probes; `dc`, `cluster` and `node` identify the node, `probe` the check that failed. Unit: count."
sprig_cluster_semi_sync_status = "Whether semi-synchronous replication is active on the cluster's writer; labelled by `dc` and `cluster`. Unit: 0 or 1."
sprig_controller_catalog_acquire_timeouts_total = "Times a controller waited too long for a connection to a tenant catalog and gave up with `ER_SPRIG_CATALOG_UNAVAILABLE`. Unit: count."
sprig_controller_catalog_pool_connections = "Controller connections to tenant catalogs; `cluster` is the cluster, `pool` the budget they belong to, `state` `leased`, `idle` or `waiting`. Unit: count."
sprig_controller_cluster_failovers_total = "Writer failovers inside a cluster; `topology` is the cluster's topology, `result` is `promoted` or `blocked` (an operator must decide). Unit: count."
sprig_controller_clusters_drained_total = "Clusters that finished draining: no shard map names them any more. Unit: count."
sprig_controller_dc_failovers_total = "Data-centre failovers run by the global leader; `result` is `started` or `done`. Unit: count."
sprig_controller_dc_lease_remaining_seconds = "Time left on this data centre's lease in the global tier; 0 means the lease is lost and the data centre fences itself. Unit: seconds."
sprig_controller_dc_rtt_seconds = "Measured round-trip time from this data centre to another; `to_dc` is the other data centre. Unit: seconds."
sprig_controller_dc_spare_ratio = "Spare capacity of a data centre for new tenants; `dc` is the data centre, `resource` is `storage`, `cpu` or `connections`. Unit: ratio."
sprig_controller_diverged_transactions_total = "Transactions found on a former writer that the new writer never received, reported after a failover; `level` is `cluster` or `dc`. Unit: count."
sprig_controller_diverged_writers_total = "Times two writable nodes were found in one cluster after a failover. Should stay at 0. Unit: count."
sprig_controller_failover_duration_seconds = "Time from losing a writer to the new one taking writes (recovery time); `level` is `cluster` or `dc`. Unit: seconds."
sprig_controller_failover_loss_seconds = "Estimated data loss of a failover, as the lag of the promoted copy; `level` is `cluster` or `dc`. Unit: seconds."
sprig_controller_failovers_suppressed_total = "Failovers the damper held back, such as within `failover.min_interval_minutes` of the last one; `level` is `cluster` or `dc`. Unit: count."
sprig_controller_jobs = "Background jobs known to the controller; `kind` is the job kind, `state` its state. Unit: count."
sprig_controller_leader_changes_total = "Times this controller became leader; `tier` is the data-centre or global tier. Unit: count."
sprig_controller_least_busy_placements_total = "New tenants placed in the least-busy data centre; `reason` is `new`, `tie` or `relief`. Unit: count."
sprig_controller_loop_blocked = "Work items a controller loop can't process yet because they wait on something else; `loop` names the loop. Unit: count."
sprig_controller_migration_blocked = "Whether automatic moves of tenants between data centres are held back; `reason` is `size` (`migration.auto_size_limit_gb`) or `concurrency`. Unit: 0 or 1."
sprig_controller_migration_phase_seconds = "Duration of tenant moves between data centres; `phase` is the phase, `total` for the whole move. Unit: seconds."
sprig_controller_migration_write_pause_seconds = "Write pause of each tenant move between data centres (target `migration.write_pause_target_ms`). Unit: seconds."
sprig_controller_migrations_total = "Tenant moves between data centres started; `cause` is what triggered it (operator, traffic, residency), `result` is `started` or `auto_started`. Unit: count."
sprig_controller_observed_writer_changes_total = "Writer changes made outside SprigDB that the controller observed and published after `failover.observe_settle_ms`. Unit: count."
sprig_controller_queue_depth = "Work items queued for a controller loop; `loop` names the loop. Unit: count."
sprig_controller_reconcile_duration_seconds = "Time of one reconcile step of a controller loop; `loop` names the loop. Unit: seconds."
sprig_controller_residency_changes_total = "Residency policies applied to tenants. Unit: count."
sprig_controller_residency_remote_traffic_total = "Times a tenant's best data centre for its traffic lay outside its residency, so it wasn't moved there. Unit: count."
sprig_controller_residency_tenants = "Tenants with a residency policy by compliance; `state` is `compliant`, `converging` or `violated`. Unit: count."
sprig_controller_residency_violations_total = "Residency violations the controller acted on; `point` is what was out of place, such as `home` or `standby`. Unit: count."
sprig_controller_standbys_total = "Standby copies of tenants in other data centres; `result` is `created` or `dropped`. Unit: count."
sprig_controller_tenant_jobs_per_hour_max = "The highest number of jobs any one tenant started in the last hour (limit `control.tenant_jobs_per_hour`). Unit: count."
sprig_controller_traffic_reports_total = "Per-tenant traffic reports received from gateways for data-centre placement. Unit: count."
sprig_controller_traffic_tenants = "Tenants with traffic data held for data-centre placement. Unit: count."
sprig_ddl_abandoned_jobs_resolved_total = "Schema-change jobs finished or undone after the process running them stopped; `by` is who resolved it, `owner` is `this_engine` or `gone`, `action` what was done. Unit: count."
sprig_ddl_jobs_total = "Schema-change jobs across shards; `kind` is the job kind, `outcome` how it ended (such as `ok` or `rolled_back`). Unit: count."
sprig_ddl_mover_waits_total = "Schema changes that had to wait for a split, merge or move on their table; `outcome` is `waited` or `timeout` (`ER_SPRIG_SHARD_BUSY`). Unit: count."
sprig_ddl_shard_skew_total = "Shards whose definition of a table differed from the first shard's after a schema change. Unit: count."
sprig_ddl_shard_steps_total = "Per-shard steps of schema changes; `method` is the algorithm used (such as instant or inplace), `outcome` `ok` or `error`. Unit: count."
sprig_dim_merge_groups = "Groups the gateway merged for one dimensional analytics query. Unit: count."
sprig_dim_queries_total = "Dimensional analytics queries; `plan` is how the query was answered. Unit: count."
sprig_dim_query_duration_seconds = "Duration of dimensional analytics queries. Unit: seconds."
sprig_dim_rejected_total = "Dimensional analytics queries refused; `reason` is `admission` when too many already run (`analytics.max_concurrent_per_tenant`). Unit: count."
sprig_doc_path_publications_total = "Document paths published as typed columns so they can be indexed; `kind` is `array` or `timeout` when publishing gave up. Unit: count."
sprig_doc_path_publish_seconds = "Time a document write waited for a new document path to be published as a typed column before continuing. Unit: seconds."
sprig_doc_ttl_deleted_total = "Documents deleted by TTL indexes because their date field was older than the index's `expireAfterSeconds`; `cluster` is the cluster that held them. Unit: count."
sprig_doc_ttl_passes_total = "Passes of the worker's TTL task over the collections that have TTL indexes, one every `doc.ttl_interval_seconds`. Unit: count."
sprig_docs_load_seconds = "Time the controller took to load the docs pack into one cluster's `__sprig_docs`: delete, insert in batches, read back and verify. Unit: seconds."
sprig_docs_pack_info = "The docs pack the controller verified and loads; `version` is its release, `sha` the first bytes of its SHA-256. Always 1. Unit: 0 or 1."
sprig_docs_search_degraded_total = "Docs searches answered by keywords only because the gateway's embedding model couldn't be loaded or run (`docs.model_dir`). Unit: count."
sprig_docs_search_seconds = "Duration of docs searches on this gateway; `mode` is `hybrid` (full-text and embedding), `keyword` (full-text only) or `sql` (a statement on the `sprig_docs` database). Unit: seconds."
sprig_docs_search_total = "Docs searches and `sprig_docs` statements; `result` is `ok`, `empty`, `invalid`, `refused` (a write), `unavailable` (no cluster has the docs) or `error`. Unit: count."
sprig_docs_verify_failures_total = "Times the docs rows on a cluster didn't match the pack: edited rows found at start, or rows that didn't read back after a load. Each is reloaded. Unit: count."
sprig_feed_binlog_dumps = "Binlog dump connections open from this process to MariaDB; `node` is the MariaDB node (`host:port`), `kind` is `tenant` (one tenant's own dump), `shared` (a cluster's shared feed reader) or `catchup` (a private dump that brings one tenant up to the shared reader). Unit: count."
sprig_feed_buffered_bytes = "Estimated bytes of decoded transactions waiting in this process's shared feed readers: read ahead of the reader, or sent to a subscription and not read yet. Each buffer holds at most twice the largest transaction the feed keeps (64 MiB); a subscription past it is detached. Unit: bytes."
sprig_feed_catchup_readers = "Private catch-up dumps open, each reading the binlog for one tenant's subscription until the shared feed reader's ring covers its position; `cluster` is the cluster. Only a few run at once per cluster; the rest wait for a slot. Unit: count."
sprig_feed_events_total = "Change events the change feed produced from a cluster's binlog; `cluster` is the cluster. Unit: count."
sprig_feed_filtered_total = "Binlog changes the change feed left out; `reason` is why: `internal` (SprigDB's own tables), `apply` (writes by a move's apply), `owner` or `noop`. Unit: count."
sprig_feed_handoffs_total = "Times a change-feed reader followed a tenant's move to another cluster. Unit: count."
sprig_feed_history_lost_total = "Binlog dumps a node refused because events a change-feed reader still needs are purged from its binary logs: those changes are lost to that reader, which fails with 39800 at every retry. The error log names the GTID domain, the reader's position and where the node's oldest binary log starts. Alert on any increase. `node` is the MariaDB node (`host:port`). Unit: count."
sprig_feed_local_domains_added_total = "Times a change-feed reader's dump was refused because a Galera node purged the start of one of its node-local GTID domains (its own local writes, such as statements run with `wsrep_on = OFF` or an index built by hand with RSU, never a tenant's changes), and the reader added that domain to its position and read on. `node` is the MariaDB node (`host:port`), `domain` the GTID domain. Unit: count."
sprig_feed_overflow_lost_total = "Times a feed reader stopped at a transaction too large to keep that changed a table it reads (error 39800); a search copy then seeds again. Unit: count."
sprig_feed_resumes_total = "Feed subscriptions that resumed from an earlier position; `tier` is `ring` (served from the shared feed reader's in-memory ring of recent groups), `replay` (a subscription a little behind the reader, up to 20,000 groups: the reader reopens its dump at that position and reads those groups again, which the other subscriptions skip) or `binlog` (served by a catch-up dump). Unit: count."
sprig_feed_ring_groups = "Committed transaction groups kept in the shared feed reader's in-memory ring of recent history, for subscriptions that resume; `cluster` is the cluster. Updated about once a second. Unit: count."
sprig_feed_shared_detached_total = "Subscriptions the shared feed reader detached because their buffer was full when a group arrived, so a slow consumer never holds up the others; a detached subscription comes back through the ring or a catch-up dump. `cluster` is the cluster. Unit: count."
sprig_feed_shared_dumps_total = "Binlog dump connections the shared feed reader opened (one per cluster and worker process, plus reconnects); `cluster` is the cluster. Unit: count."
sprig_feed_shared_groups_total = "Committed transaction groups the shared feed reader read; `cluster` is the cluster. Unit: count."
sprig_feed_shared_subscriptions = "Subscriptions attached to the shared feed reader of each cluster in this process, such as queue forwarders, stream sequencers and change topics; `cluster` is the cluster. Updated about once a second. Unit: count."
sprig_feed_txn_overflow_total = "Transactions whose row changes were larger than the feed keeps (64 MiB, estimated): their rows were let go and only the tables they touched kept, so one bulk load can't fill a reader's memory. Readers of those tables read them again from MariaDB (search copies seed again); other readers pass them by. Unit: count."
sprig_fk_actions_total = "Cascading foreign-key statements the gateway ran for foreign keys across table groups; `action` is `cascade` or `set_null`. Unit: count."
sprig_fk_checks_total = "Foreign-key checks the gateway ran across table groups; `side` is `child` (does the parent exist) or `parent` (do children exist), `result` is `ok` or `violation`. Unit: count."
sprig_gateway_ack_lease_lapses_total = "Times this gateway's acknowledgement lease ran out or failed to renew (for example, after a pause or a lost connection to the DC's store). Until the lease is renewed, the gateway reloads each tenant's catalog from the writer before that tenant's next statement, so it never plans with a stale catalog. Unit: count."
sprig_gateway_admission_backoffs_total = "New connections turned away with `ER_SPRIG_ADMISSION_BACKOFF` while the data centre returns from an outage; `protocol` is the front end. Unit: count."
sprig_gateway_admission_rate = "New connections per second this gateway admits while its data centre returns from an outage; 0 when no limit applies. Unit: connections per second."
sprig_gateway_admission_wait_seconds = "Time statements waited for an admission slot (`limits.tenant_active_statements`, `limits.user_active_statements`) before running or timing out. Unit: seconds."
sprig_gateway_cert_expiry_seconds = "Time until the TLS certificate of each bundle expires; `bundle` is the bundle name. Alert well before 0. Unit: seconds."
sprig_gateway_connections = "Client connections open on this gateway; `listener` is the listener, `state` is `open`. Unit: count."
sprig_gateway_connections_rejected_total = "Client connections refused; `listener` is the listener (`any` for tenant limits), `reason` is `max_connections`, `tenant_limit`, `admission` or `accept_error`, among others. Unit: count."
sprig_gateway_dc_hints_total = "Data-centre hints clients sent with statements; `protocol` is the front end, `result` whether the hint was used, unknown or ignored. Unit: count."
sprig_gateway_draining = "Whether this gateway is draining (shutting down or drained by an operator). Unit: 0 or 1."
sprig_gateway_fence_errors_total = "Statements that met a mover's fence on a shard; `outcome` is `retried` (run again on the new map), `txn_lost` (the transaction got 1213) or `timeout`. Unit: count."
sprig_gateway_fenced = "Whether this gateway refuses writes because its data-centre permit lapsed. Unit: 0 or 1."
sprig_gateway_fenced_writes_total = "Writes refused with `ER_SPRIG_DC_FENCED` because the gateway had no valid data-centre permit. Unit: count."
sprig_gateway_graph_offloaded_total = "Graph operations run on a blocking thread so they don't hold the gateway's async workers. Unit: count."
sprig_gateway_graph_unslotted_total = "Graph operations offloaded without a free offload slot. Unit: count."
sprig_gateway_hold_timeouts_total = "Statements that waited for a move's cutover hold past its deadline and got 1205. Unit: count."
sprig_gateway_hold_waits_total = "Statements that waited for a move's cutover hold to clear before running. Unit: count."
sprig_gateway_large_request_seconds = "Time large requests (over `gateway.large_statement_bytes`) ran on a blocking thread. Unit: seconds."
sprig_gateway_large_requests_total = "Large requests (over `gateway.large_statement_bytes`) run on a blocking thread. Unit: count."
sprig_gateway_lease_lost_total = "Times this gateway lost its registration lease in the control plane and re-registered. Unit: count."
sprig_gateway_listener_generation = "Configuration generation of each listener; it rises whenever the listener's bind address, TLS or certificate changes. `listener` is the listener. Unit: count."
sprig_gateway_listener_plaintext_public = "Whether a listener accepts plaintext connections on a non-loopback address; `listener` is the listener. Unit: 0 or 1."
sprig_gateway_load_report_trimmed_total = "Load reports this gateway trimmed to fit the registration record's size limit, keeping the cluster totals and the newest, most-written index sketches and dropping the rest, so the report still registers. Unit: count."
sprig_gateway_load_reports_total = "Write-load reports this gateway sent for placement and hot-shard detection. Unit: count."
sprig_gateway_long_polls_total = "Single polls of a request that held an async worker of the gateway for 250 ms or more. Unit: count."
sprig_gateway_offloaded_steps_total = "Large synchronous steps (such as sorting or hashing) moved off the gateway's async workers. Unit: count."
sprig_gateway_overhead_seconds = "Time statements spent in the gateway itself, excluding time waiting on MariaDB; `protocol` is the front end. Unit: seconds."
sprig_gateway_permit_remaining_seconds = "Time left on this gateway's data-centre write permit; at 0 it refuses writes. Unit: seconds."
sprig_gateway_promotion_hold_seconds = "Time statements waited while their tenant was promoted to a new home data centre. Unit: seconds."
sprig_gateway_promotion_hold_timeouts_total = "Statements that waited for a tenant's promotion past the limit and got 1205. Unit: count."
sprig_gateway_promotion_holds_total = "Statements held while their tenant was promoted to a new home data centre. Unit: count."
sprig_gateway_query_duration_seconds = "End-to-end statement duration as the client sees it: admission, gateway and MariaDB; `protocol` is the front end, `tenant` the tenant id for busy tenants (empty otherwise). Unit: seconds."
sprig_gateway_recovery_fenced_writes_total = "Writes refused with `ER_SPRIG_RECOVERY_FENCED` because the tenant's copy here is fenced after a failover. Unit: count."
sprig_gateway_remote_home_statements_total = "Statements this gateway served for tenants homed in another data centre; `home_dc` is that data centre. Unit: count."
sprig_gateway_runtime_stalls_total = "Times the watchdog found the gateway's async runtime stuck for twice `failover.watchdog_ms`. Unit: count."
sprig_gateway_shed_requests_total = "Requests moved to a blocking thread after using 100 ms of an async worker. Unit: count."
sprig_gateway_stall_kills_total = "Statements stopped because they held an async worker while the runtime was stuck. Unit: count."
sprig_gateway_statements_total = "Statements the gateway finished; `protocol` is the front end, `result` is `ok`, `client` (the application's error), `sprig` (SprigDB's error) or `backend` (MariaDB unreachable or failed), `tenant` the tenant id for busy tenants. Unit: count."
sprig_gateway_tls_handshakes_total = "TLS handshakes on client listeners; `listener` is the listener, `version` the negotiated TLS version (`none` on failure), `outcome` the result. Unit: count."
sprig_gateway_unacknowledged_writes_total = "Writes that finished after the gateway's data-centre permit lapsed, answered with `ER_SPRIG_DC_FENCED` instead of OK. Unit: count."
sprig_geo_knn_rounds = "Search rounds (widening the radius) a nearest-neighbour geospatial query needed. Unit: count."
sprig_graph_budget_exceeded_total = "Graph statements stopped by a budget (`ER_SPRIG_GRAPH_BUDGET_EXCEEDED`); `reason` is the budget: hops, frontier, rows, time or memory. Unit: count."
sprig_graph_expansion_hops = "Hops a graph pattern expansion went through. Unit: count."
sprig_graph_frontier_nodes = "Nodes in the frontier at each step of a graph traversal. Unit: count."
sprig_graph_mirror_applied_total = "Rows the graph mirror applier wrote or deleted on workers. Unit: count."
sprig_graph_mirror_checkpoint_age_seconds = "Time since the oldest graph mirror applier on this worker last recorded its checkpoint (its binlog positions in the job record), from the job's start if it hasn't yet. Written every 2 s while etcd answers. Unit: seconds."
sprig_graph_mirror_checkpoint_failures_total = "Graph mirror checkpoints (the applier's binlog positions in the job record) that failed to write; the applier keeps applying and tries again after a backoff, and a new owner resumes at the catalog's position rows meanwhile. Unit: count."
sprig_graph_mirror_wait_seconds = "Time graph reads waited for the graph mirror to catch up. Unit: seconds."
sprig_graph_mirror_waits_total = "Graph reads that asked whether the graph mirror had caught up; `outcome` is `ok`, `lag` (still behind after the wait, or not served), `skipped` (behind, and the graph's waits are paused because recent reads waited the whole `graph.mirror_max_wait_ms` in vain), `busy` (no connection for the check in time) or `error`. Every outcome but `ok` reads incoming hops from every shard instead. Unit: count."
sprig_graph_route_hold_waits_total = "Auto-commit Bolt reads that waited for a move's hold on a shard they route to. Unit: count."
sprig_graph_shard_queries_total = "Shard queries graph traversals ran; `tier` is how the step ran: `join`, `cte`, `gateway` or `plugin`. Unit: count."
sprig_graph_spares_total = "Extra backend connections auto-commit graph reads asked for, to read several shards of a cluster at once; `outcome` is `taken`, `budget` (the cluster's spare budget, a quarter of the session pool, was used up) or `busy` (none free within 50 ms). Without one, the shards are read one after another. Unit: count."
sprig_graph_stale_map_retries_total = "Auto-commit graph statements run again after a split, merge or move changed the shard map. Unit: count."
sprig_graph_statement_duration_seconds = "Duration of graph statements; `language` is the query language (such as `cypher`), `kind` is `read` or `write`. Unit: seconds."
sprig_graph_statements_total = "Graph statements; `language` is the query language, `kind` `read` or `write`, `result` `ok` or `error`. Unit: count."
sprig_hierarchy_backfill_rows_total = "Rows whose hierarchy paths were filled in by `ADD HIERARCHY`. Unit: count."
sprig_hierarchy_move_size_rows = "Rows moved when a record and its subtree moved to a new parent. Unit: rows."
sprig_hierarchy_moves_total = "Subtree moves in hierarchical tables; `scope` is where the move ran, such as `local`. Unit: count."
sprig_ids_blocks_fetched_total = "Id blocks fetched from the catalog for generated ids; `kind` is `auto_increment` or `inherit_tree`. Unit: count."
sprig_ids_collision_retries_total = "Statements run again with new ids after a generated id collided with an existing row. Unit: count."
sprig_ids_fetch_duration_seconds = "Time to fetch an id block from the tenant's catalog. Unit: seconds."
sprig_ids_reserved_refusals_total = "Explicit `AUTO_INCREMENT` values refused because another gateway holds their id block (`ER_SPRIG_ID_VALUE_RESERVED`). Unit: count."
sprig_inherit_adopted_tables_total = "Tables created in a child tenant because its parent shares them. Unit: count."
sprig_inherit_adopted_types_total = "Types written into a child tenant with the type trees it inherits. Unit: count."
sprig_inherit_blocked_instances = "Inherited trigger and sink instances blocked because a member revoked a privilege they need. Unit: count."
sprig_inherit_broadcast_deliveries_total = "Deliveries of broadcasts into member tenants' instances; `result` is `delivered` or `failed`. Unit: count."
sprig_inherit_broadcast_lag_seconds = "Time from a broadcast's commit until its last member was reached. Unit: seconds."
sprig_inherit_broadcasts_total = "Broadcasts published to the members of an inherited definition; `form` is the broadcast's form. Unit: count."
sprig_inherit_copy_exact_reads_total = "Materialised copies of inherited tables on engine databases that a statement considered, by outcome: `current` (the copy had applied every commit the statement could see), `waited` (it caught up within inherit.copy_wait_ms) or `read_through` (it was behind, or in a transaction, so the statement read the levels above instead). Unit: count."
sprig_inherit_copy_kept_serving_total = "Materialised copies of inherited tables that kept serving after the child tenant added columns of its own. Unit: count."
sprig_inherit_copy_seeds_total = "Materialised copies of shared data seeded in child tenants by the copy worker. Unit: count."
sprig_inherit_deletes_refused_total = "Deletes refused with 1451 because a row at or below the tenant's level still references the key. Unit: count."
sprig_inherit_discriminators_followed_total = "Child tenants whose type trees followed a parent's new discriminator. Unit: count."
sprig_inherit_discriminators_unfollowed_total = "Child tenants whose type trees couldn't follow a parent's new discriminator; the log says why. Unit: count."
sprig_inherit_drops_total = "Instances of inherited definitions removed; `how` is `grace`, `empty`, `immediate`, `detached`, `orphan_sink` or `stale_instance_row`. Unit: count."
sprig_inherit_fanin_consumers = "Fan-in queue consumers running on this gateway, each reading the members' instances of an inherited queue. Unit: count."
sprig_inherit_fanin_deliveries_total = "Messages delivered to fan-in consumers from members' instances; `kind` is `queue`. Unit: count."
sprig_inherit_fanin_skipped_total = "Member tenants left out of fan-in reads; `reason` is why, such as `residency`. Unit: count."
sprig_inherit_handovers_total = "References handed over when deleting rows whose overrides in child tenants became orphans. Unit: count."
sprig_inherit_hierarchy_conflicts_total = "Changes from an ancestor tenant to an inherited hierarchy that conflict with a descendant tenant's own tree; that tenant's paths for those records stay as they were. Unit: count."
sprig_inherit_hierarchy_locks_released_total = "Inherited-hierarchy locks a gateway session released when its transaction ended. Unit: count."
sprig_inherit_hierarchy_locks_total = "Inherited-hierarchy locks a gateway session took on a descendant tenant's tree, so its structure can't change until the transaction ends. Unit: count."
sprig_inherit_hierarchy_overrides_total = "Path overrides of record hierarchies on inheritable tables, kept where a child tenant's view of the tree differs from the one it inherits; `op` is `set` (written or updated) or `clear` (removed). Unit: count."
sprig_inherit_hierarchy_reconciles_total = "Structural changes to a record hierarchy on an inheritable table (rows added, moved or deleted) reconciled into the child tenants that inherit the table. Unit: count."
sprig_inherit_hierarchy_tenant_checks_total = "Descendant tenants checked, and locked until the transaction ends, when a change to an inherited hierarchy is written. Unit: count."
sprig_inherit_hierarchy_tenant_reconciles_total = "Descendant tenants whose paths in an inherited hierarchy were recomputed after a change above them. Unit: count."
sprig_inherit_id_collisions_found_total = "Ids that `SPRIG CHECK IDS` found held by more than one tenant of a tree. Unit: count."
sprig_inherit_id_collisions_total = "Ids already held by more than one tenant when a tree-wide sequence was created; reported, not renumbered. Unit: count."
sprig_inherit_instance_create_retries_total = "Instances of inherited definitions created again after a transient failure; `kind` is the object kind. Unit: count."
sprig_inherit_instance_create_seconds = "Time to create a tenant's instance of an inherited definition; `kind` is the object kind (stream, queue, sink, trigger). Unit: seconds."
sprig_inherit_instance_creations_total = "Instances of inherited definitions created; `kind` is the object kind, `cause` what triggered it (such as `declare` or first use). Unit: count."
sprig_inherit_layer_writes_total = "Writes to the override layer of inherited data; `op` is `override`, `add`, `hide` or `reset`. Unit: count."
sprig_inherit_orphan_claims_total = "Reference claims the copy worker made for orphaned rows across tenants. Unit: count."
sprig_inherit_orphans_total = "Child-tenant rows left as orphans when shared data went away; `policy` is the orphan policy (such as `keep`), `path` is `sync`, `async` or `unshare`. Unit: count."
sprig_inherit_publishes_total = "Messages published into inherited streams and queues; `kind` is the object kind, `path` is `own`, `direct` or `outbox`. Unit: count."
sprig_inherit_reads_total = "Reads of inherited data; `mode` is how it was read, such as `read_through` (a view over the parent's rows). Unit: count."
sprig_inherit_ready_index_writes_total = "Updates to the index of member instances ready for fan-in reads; `op` is `put` or `delete`. Unit: count."
sprig_inherit_refused_total = "Publishes and changes to inherited objects refused; `reason` is why, such as `target` or `no_target`. Unit: count."
sprig_inherit_remote_calls_total = "Calls to a gateway of another data centre for a `FOR EACH TENANT` change reaching the members that data centre indexes; `op` is `drop_sink`, `rollout`, `drop_trigger`, `override`, `count` or `broadcast`, `outcome` is `ok` or `failed`. Unit: count."
sprig_inherit_sink_retries_total = "Retries to deploy an inherited sink in a member; `result` is `deployed` or `dropped`. Unit: count."
sprig_inherit_unshare_failures_total = "`DROP SHARE` statements whose clean-up in child tenants failed after its retries. Unit: count."
sprig_inherit_unshare_swept_total = "Dropped shares whose cleanup in the child tenants (removing the share views, turning overrides into the child's own rows, clearing hides) was finished later by a sweep, because the DROP SHARE that started it was cut off. Unit: count."
sprig_inherit_widened_columns_total = "Columns widened in child tenants after their parent widened them. Unit: count."
sprig_kafka_fetch_bytes_total = "Record bytes returned to Kafka consumers by fetch requests. Unit: bytes."
sprig_kafka_group_rebalances_total = "Kafka consumer-group rebalances (generation changes). Unit: count."
sprig_kafka_produce_duplicates_total = "Retried idempotent Kafka produce batches answered without appending again. Unit: count."
sprig_kafka_produce_wait_seconds = "Time Kafka produce requests waited for their records' offsets. Unit: seconds."
sprig_kafka_request_duration_seconds = "Duration of Kafka protocol requests; `api` is the Kafka API name. Unit: seconds."
sprig_kafka_requests_total = "Kafka protocol requests; `api` is the Kafka API name, `result` is `ok`, `auth_failed` or `error`. Unit: count."
sprig_kv_orphan_elements_deleted_total = "Elements of deleted key-value collections (hash fields, set members) removed by the background sweep. Unit: count."
sprig_kv_purged_keys_total = "Expired keys removed by the key-value expiry sweep. Unit: count."
sprig_logic_schedule_runs_total = "Runs of logic schedules of engine databases started by the gateway on the tenant's leader, and fires passed over; `outcome` is `ok`, `error`, `budget`, `skipped` or `misfired`. Unit: count."
sprig_lookup_claims_total = "Values claimed in unique lookup indexes by inserts; `result` is `inserted`, `own`, `reclaimed` or `duplicate`. Unit: count."
sprig_lookup_publish_fenced_total = "Gateways fenced because they didn't acknowledge a lookup change within `lookup.publish_timeout_ms`: their leases were revoked, so they reload the tenant's catalog before their next statement of it. Unit: gateways."
sprig_lookup_publish_seconds = "How long a lookup change waited for every gateway of the DC to load the new catalog version (fenced gateways included). Unit: seconds."
sprig_meta_cache_staleness_seconds = "How far behind the control plane this process's cached view is; `source` is the tier (data centre or global), `prefix` the key range. Unit: seconds."
sprig_meta_members = "etcd members this process's client knows; `tier` is the data-centre or global tier. Unit: count."
sprig_meta_reconfigurations_total = "Live configuration changes applied from settings; `what` is what changed (such as `listener`), `result` is `applied` or `not_applied`. Unit: count."
sprig_meta_watch_restarts_total = "Times a watch on the control plane restarted; `tier` is the tier, `reason` why. Unit: count."
sprig_mongo_auth_total = "MongoDB logins; `mechanism` is the SASL mechanism (`SCRAM-SHA-256`), `result` `ok` or `failed`. Unit: count."
sprig_mongo_command_duration_seconds = "Duration of MongoDB commands; `command` is the command name. Unit: seconds."
sprig_mongo_commands_total = "MongoDB commands; `command` is the command name, `result` `ok`, `error` or `interrupted`. Unit: count."
sprig_mongo_connections = "MongoDB connections open on this gateway; `dc` is reserved for the data centre. Unit: count."
sprig_mongo_cursor_timeouts_total = "MongoDB cursors closed for being idle past `mongo.cursor_timeout_ms`; `kind` is `find`. Unit: count."
sprig_mongo_change_streams_relayed_total = "MongoDB change streams of tenants homed in another data centre whose change feed is relayed from a gateway there; `outcome` is `opened`, `refused` (the home gateway refused it, as under residency) or `unavailable` (no gateway there answered). Unit: count."
